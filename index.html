<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuri Plaz - Menú Móvil</title>
    <style>
        /* Configuración base para que no haya espacios en blanco */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #fff;
            overflow: hidden; /* Evita que la pantalla se mueva */
        }

        /* Barra roja superior (Exacta a tu imagen) */
        header {
            background-color: #ff0000;
            color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            font-weight: 900;
            font-size: 1.5rem;
            text-transform: uppercase;
            z-index: 10;
        }

        /* Contenedor que apila las categorías una debajo de otra */
        .contenedor-menu {
            display: flex;
            flex-direction: column;
            flex: 1; /* Ocupa todo el espacio sobrante */
        }

        /* Cada fila de categoría */
        .opcion {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #000;
            overflow: hidden;
            border-bottom: 2px solid #fff; /* Pequeña línea divisoria blanca */
        }

        /* Ajuste de las imágenes para que llenen la fila */
        .opcion img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Esto es clave para que no se deformen */
            z-index: 1;
        }

        /* Texto centrado y grueso (Negro como en tu foto) */
        .opcion span {
            position: relative;
            z-index: 3;
            font-size: 2.2rem;
            font-weight: 900;
            /* Sombra blanca para asegurar que se lea sobre cualquier imagen */
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.7);
        }

        /* Efecto de luz al presionar con el dedo */
        .opcion::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0);
            z-index: 2;
            transition: background 0.2s;
        }

        .opcion:active::after {
            background: rgba(255, 255, 255, 0.4); /* Destello de luz */
        }

    </style>
</head>
<body>

    <header>
        <span>YURI PLAZ</span>

    </header>

    <nav class="contenedor-menu">

        </a>
        <a href="bolsas.html" class="opcion">

            <span>Bolsas</span>
        </a>
        <a href="jabones.html" class="opcion">

            <span>Jabones</span>
        </a>
        <a href="vinipeles.html" class="opcion">
            <img src="https://www.todoaseo.com/wp-content/uploads/2017/01/PAPEL-VINIPEL-X-1500-M-REF-06986.jpg" alt="Vinipeles">

        <a href="recipientes.html" class="opcion">

    </nav>

</body>
</html>
