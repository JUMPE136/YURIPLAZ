<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuri Plaz - Menú</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Arial', sans-serif;
            background-color: #fff;
            /* Quitamos el overflow hidden para permitir el deslizamiento */
        }

        header {
            background-color: #ff0000;
            color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            font-weight: 900;
            font-size: 1.5rem;
            text-transform: uppercase;
            /* Fijamos el header arriba para que no se pierda al bajar */
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .contenedor-menu {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .opcion {
            /* Definimos una altura fija mínima para que cada cuadro se vea bien */
            height: 180px; 
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #000;
            overflow: hidden;
            border-bottom: 3px solid #fff;
        }

        .opcion img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .opcion span {
            position: relative;
            z-index: 3;
            font-size: 2.2rem;
            font-weight: 900;
            text-shadow: 2px 2px 5px rgba(255, 255, 255, 0.9);
            text-transform: uppercase;
        }

        .opcion::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0);
            z-index: 2;
            transition: background 0.2s;
        }

        .opcion:active::after {
            background: rgba(255, 255, 255, 0.4);
        }

    </style>
</head>
<body>

    <header>
        <span>YURI PLAZ</span>
        <span>INICIO</span>
    </header>

    <nav class="contenedor-menu">
        <a href="vasos.html" class="opcion">
            <img src="img/vasos.webp" alt="Vasos">
            <span>Vasos</span>
        </a>
        <a href="bolsas.html" class="opcion">
            <img src="img/bolsas.jpg" alt="Bolsas">
            <span>Bolsas</span>
        </a>
        <a href="jabones.html" class="opcion">
            <img src="img/jabones.avif" alt="Jabones">
            <span>Jabones</span>
        </a>
        <a href="vinipeles.html" class="opcion">
            <img src="img/vinipeles.jpg" alt="Vinipeles">
            <span>Vinipeles</span>
        </a>
        <a href="recipientes.html" class="opcion">
            <img src="img/resipientes.png" alt="Recipientes">
            <span>Recipientes</span>
        </a>
        <a href="portacomidas.html" class="opcion">
            <img src="img/porta comidas.jpg" alt="Portacomidas">
            <span>Portacomidas</span>
        </a>
    </nav>

</body>
</html>
